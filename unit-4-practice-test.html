<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e6edf9">
<title>Unit 4 Practice TEST</title>
<style>
  :root { color-scheme: light; --blue:#123f9c; --blue-2:#0d3280; --ink:#1d2430; --muted:#596270; --line:#d0d5dc; --pale:#e5edf9; --surface:#fff; --good:#14753c; --good-bg:#edf8f0; --bad:#a82424; --bad-bg:#fff0ef; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:Arial, Helvetica, sans-serif; min-height:100vh; }
  button { font:inherit; }
  .topbar { height:58px; background:var(--pale); border-bottom:2px solid #c5d1e4; display:flex; align-items:center; justify-content:space-between; padding:0 26px; position:fixed; inset:0 0 auto; z-index:5; }
  .brand { font-weight:700; font-size:15px; letter-spacing:.01em; }
  .top-tools { display:flex; align-items:center; gap:24px; color:#384557; font-size:12px; }
  .tool { display:flex; gap:7px; align-items:center; white-space:nowrap; }
  .tool svg { width:15px; height:15px; }
  main { min-height:100vh; padding:82px 30px 86px; display:flex; align-items:flex-start; justify-content:center; }
  .workspace { width:min(1120px,100%); min-height:calc(100vh - 168px); display:flex; align-items:flex-start; justify-content:center; gap:36px; }
  .stimulus { display:none; width:40%; max-width:420px; align-self:flex-start; padding-top:12px; color:#20242b; font-size:15px; line-height:1.55; }
  .stimulus.visible { display:block; }
  .stimulus .quote { font-family:Georgia, 'Times New Roman', serif; white-space:pre-line; }
  .stimulus .citation { color:#535b66; text-align:right; font-size:13px; margin-top:16px; }
  .stimulus .art { display:block; width:100%; max-height:350px; object-fit:contain; background:#f8f8f8; margin:8px auto 12px; }
  .stimulus .map { display:block; width:min(100%,340px); max-height:430px; object-fit:contain; margin:0 auto 12px; border:1px solid #ddd; }
  .stimulus .caption { color:#4a5360; font-size:12px; line-height:1.4; }
  .stimulus .note { font-style:italic; font-size:13px; margin-top:14px; }
  .question-pane { width:min(720px,100%); flex:0 1 720px; }
  .workspace.with-stimulus { justify-content:space-between; }
  .workspace.with-stimulus .question-pane { flex:1 1 610px; width:auto; padding-top:0; }
  .question-head { display:flex; align-items:center; gap:10px; border-bottom:1px solid #858c95; min-height:38px; margin-bottom:12px; }
  .qnumber { background:#111; color:white; font-size:15px; line-height:22px; min-width:25px; text-align:center; font-weight:700; padding:0 4px; }
  .review-toggle { border:0; background:none; color:#303640; padding:6px 2px; cursor:pointer; display:flex; align-items:center; gap:7px; font-size:13px; }
  .review-toggle svg { width:15px; height:18px; fill:none; stroke:currentColor; stroke-width:1.7; }
  .review-toggle[aria-pressed="true"] { color:#a11b3a; font-weight:700; }
  .review-toggle[aria-pressed="true"] svg { fill:#a11b3a; }
  .ap-mark { margin-left:auto; background:#1b4aa4; color:white; width:19px; height:19px; border-radius:4px; font-size:7px; font-weight:700; display:grid; place-items:center; font-style:italic; }
  .prompt { font-size:15px; line-height:1.45; margin:0 0 19px; font-weight:400; }
  .choices { display:flex; flex-direction:column; gap:9px; }
  .choice { display:flex; align-items:center; gap:14px; border:1px solid #aeb3bb; border-radius:10px; min-height:46px; background:#fff; color:#20242b; text-align:left; padding:9px 13px; cursor:pointer; width:100%; transition:border-color .12s, box-shadow .12s, background .12s; }
  .choice:hover { border-color:#687b9c; background:#fbfcff; }
  .choice.selected { border:2px solid var(--blue); padding:8px 12px; box-shadow:0 0 0 1px #eef2fb; }
  .letter { display:grid; place-items:center; width:20px; height:20px; flex:0 0 20px; border:1.5px solid #555b64; border-radius:50%; font-weight:700; font-size:12px; color:#222; }
  .choice.selected .letter { border-color:var(--blue); background:var(--blue); color:#fff; }
  .choice-text { font-size:14px; line-height:1.35; }
  .choice.is-correct { border-color:#318251; background:var(--good-bg); }
  .choice.is-correct .letter { border-color:#318251; color:#176d3b; }
  .choice.is-correct.selected .letter { color:white; background:#318251; }
  .choice.is-wrong { border-color:#c14b4b; background:var(--bad-bg); }
  .choice.is-wrong .letter { border-color:#bd4545; color:#a82424; }
  .choice:focus-visible, .review-toggle:focus-visible, .action:focus-visible, .nav-button:focus-visible, .progress-pill:focus-visible, .grid-cell:focus-visible { outline:3px solid #8eafff; outline-offset:2px; }
  .action-row { display:flex; align-items:center; gap:12px; margin-top:18px; }
  .action { border:0; background:var(--blue); color:white; border-radius:7px; padding:10px 18px; font-weight:700; cursor:pointer; min-height:40px; }
  .action:hover { background:var(--blue-2); }
  .action.secondary { background:#eef2f8; color:#26374f; border:1px solid #c8d0dc; }
  .action.secondary:hover { background:#e2e9f3; }
  .feedback { display:none; margin-top:14px; padding:12px 14px; border-radius:8px; line-height:1.45; font-size:14px; border:1px solid; }
  .feedback.visible { display:block; }
  .feedback.correct { background:var(--good-bg); border-color:#a8d6b6; color:#165e33; }
  .feedback.incorrect { background:var(--bad-bg); border-color:#edb2ae; color:#812121; }
  .feedback .why { margin-top:5px; color:#333e48; }
  .shortcut-hint { color:#66707f; font-size:12px; margin-left:auto; }
  .bottom-bar { height:58px; background:var(--pale); border-top:2px solid #c5d1e4; position:fixed; inset:auto 0 0; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 24px; z-index:5; }
  .footer-brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px; color:#1c2531; }
  .apple { width:20px; height:23px; display:block; }
  .progress-pill { justify-self:center; border:0; background:#050505; color:#fff; border-radius:5px; padding:6px 12px; font-weight:700; font-size:12px; cursor:pointer; min-width:134px; }
  .nav { justify-self:end; display:flex; gap:8px; }
  .nav-button { background:var(--blue); border:0; color:white; border-radius:22px; padding:8px 19px; font-weight:700; cursor:pointer; min-width:70px; }
  .nav-button:hover:not(:disabled) { background:var(--blue-2); }
  .nav-button:disabled { opacity:.45; cursor:default; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(19,31,52,.42); display:none; align-items:center; justify-content:center; z-index:10; padding:20px; }
  .modal-backdrop.open { display:flex; }
  .modal { width:min(700px,100%); max-height:min(82vh,800px); overflow:auto; background:#fff; border-radius:12px; box-shadow:0 18px 60px rgba(0,0,0,.24); padding:24px; }
  .modal h2 { margin:0 0 8px; font-size:23px; }
  .modal-intro { margin:0 0 16px; color:#566170; font-size:14px; line-height:1.45; }
  .grid-header { display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:14px; margin:14px 0 10px; }
  .legend { color:#65707f; font-weight:400; font-size:12px; }
  .question-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:8px; }
  .grid-cell { position:relative; aspect-ratio:1; border:1px solid #aeb7c5; background:#fff; color:#183b89; font-weight:700; font-size:15px; cursor:pointer; border-radius:4px; }
  .grid-cell.answered { background:var(--blue); border-color:var(--blue); color:white; }
  .grid-cell.current { box-shadow:0 0 0 3px #9fb6eb; }
  .grid-cell.review::after { content:''; position:absolute; top:3px; right:3px; width:6px; height:8px; background:#ae1f40; clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%); }
  .score-box { padding:14px 16px; background:#f2f5fa; border-radius:8px; margin:15px 0; line-height:1.5; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  @media (max-width:760px) {
    .topbar { height:52px; padding:0 15px; }
    .brand { font-size:14px; }
    .top-tools { gap:12px; font-size:11px; }
    .top-tools .tool:first-child { display:none; }
    main { padding:68px 16px 86px; }
    .workspace, .workspace.with-stimulus { display:block; min-height:calc(100vh - 154px); }
    .stimulus, .stimulus.visible { width:100%; max-width:none; padding:0 0 18px; max-height:28vh; overflow:auto; border-bottom:1px solid #d6dbe3; margin-bottom:16px; }
    .stimulus .art { max-height:200px; }
    .stimulus .map { max-height:230px; width:auto; max-width:100%; }
    .question-pane, .workspace.with-stimulus .question-pane { width:100%; max-width:none; padding-top:0; }
    .prompt { font-size:15px; }
    .choice { min-height:44px; }
    .bottom-bar { height:58px; padding:0 12px; grid-template-columns:auto 1fr auto; gap:8px; }
    .footer-brand { font-size:0; gap:0; }
    .apple { width:19px; }
    .progress-pill { min-width:118px; padding:6px 7px; font-size:11px; }
    .nav { gap:5px; }
    .nav-button { min-width:auto; padding:8px 13px; font-size:12px; }
    .question-grid { grid-template-columns:repeat(5,1fr); }
    .shortcut-hint { display:none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Unit 4 Practice TEST</div>
  <div class="top-tools" aria-hidden="true">
    <div class="tool"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 15.5 15.5 4l1.8 1.8L5.8 17.3 3 18z"/><path d="m12.9 6.6 1.8 1.8"/></svg>Highlights &amp; Notes</div>
    <div class="tool"><svg viewBox="0 0 20 20" fill="currentColor"><circle cx="10" cy="4" r="1.2"/><circle cx="10" cy="10" r="1.2"/><circle cx="10" cy="16" r="1.2"/></svg>More</div>
  </div>
</header>
<main>
  <div class="workspace" id="workspace">
    <aside class="stimulus" id="stimulus" aria-label="Question source material"></aside>
    <section class="question-pane" aria-live="polite">
      <div class="question-head">
        <span class="qnumber" id="qnumber">1</span>
        <button class="review-toggle" id="reviewToggle" type="button" aria-pressed="false" title="Mark this question for review">
          <svg viewBox="0 0 20 24"><path d="M4 2.5h12v19l-6-4.3-6 4.3z"/></svg><span id="reviewLabel">Mark for Review</span>
        </button>
        <span class="ap-mark" aria-label="AP Classroom style mark">AP®</span>
      </div>
      <p class="prompt" id="prompt"></p>
      <div class="choices" id="choices" role="group" aria-label="Answer choices"></div>
      <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
      <div class="action-row">
        <button class="action" id="checkButton" type="button">Check answer</button>
        <button class="action secondary" id="clearButton" type="button" title="Clear this answer">Clear answer</button>
        <span class="shortcut-hint">Tip: use A–E to choose and ← → to move</span>
      </div>
    </section>
  </div>
</main>
<footer class="bottom-bar">
  <div class="footer-brand"><svg class="apple" viewBox="0 0 24 28" aria-hidden="true"><path fill="none" stroke="#1b2838" stroke-width="1.8" d="M12 6.2C9.7 1.8 5.8 4.7 4.1 8.3 1.5 13.8 5 22.1 8.4 24c1.3.7 2.4-.4 3.6-.4s2.3 1.1 3.6.4c3.2-1.8 6.8-10.2 4.2-15.7-1.7-3.6-5.6-6.5-7.8-2.1Z"/><path fill="none" stroke="#1b2838" stroke-width="1.6" d="M12 6c-.4-2.9 1.5-4.7 4.2-5"/></svg>AP Classroom</div>
  <button class="progress-pill" id="progressButton" type="button" aria-label="Open question review">Question 1 of 40　⌃</button>
  <div class="nav"><button class="nav-button" id="backButton" type="button">Back</button><button class="nav-button" id="nextButton" type="button">Next</button></div>
</footer>
<div class="modal-backdrop" id="reviewModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h2 id="modalTitle">Check Your Work</h2>
    <p class="modal-intro">Choose any question to return to it, check your answer, or mark it for review.</p>
    <div class="score-box" id="scoreBox"></div>
    <div class="grid-header"><span>Unit 4 Practice TEST Questions</span><span class="legend">Blue = answered &nbsp; • &nbsp; Red flag = for review</span></div>
    <div class="question-grid" id="questionGrid"></div>
    <div class="modal-actions"><button class="action secondary" id="closeModal" type="button">Return to test</button><button class="action" id="finishButton" type="button">Finish and see score</button></div>
  </div>
</div>

const questions = [
  {prompt:"All of the following resulted from the growth of the Atlantic slave trade in Africa EXCEPT", choices:["the shift in trade focus from Saharan routes to the coast","destabilization of local African societies","the exclusion of Africa from the emerging global market","increased violence through widespread use of firearms"], answer:2, why:"The Atlantic slave trade drew African societies into the expanding global economy. Excluding Africa from that economy was not a result of the trade."},
  {prompt:"Bolívar was describing the effects of which of the following economic policies?", choices:["Feudalism","Mercantilism","Socialism","Capitalism"], answer:1, why:"Mercantilist colonial rules restricted manufacturing and trade so colonies supplied raw materials and markets for the mother country.", stimulus:{kind:"quote", body:"“Americans . . . who live within the Spanish system occupy a position in society as mere consumers. Yet even this status is surrounded with galling restrictions, such as being forbidden to grow European crops, or to store products that are royal monopolies, or to establish factories of a type the Peninsular elite itself does not possess. To this end, the exclusive trading privileges, even in articles of prime necessity . . . in short, do you wish to know what our future holds?—simply the cultivation of the fields of indigo, grain, coffee, sugarcane, cacao, and cotton; cattle raising on the broad plains; hunting wild game in the jungles; digging in the earth to mine its gold.”", citation:"Simón Bolívar, “Jamaica Letter,” 1815"}},
  {prompt:"In recent decades, many world historians have challenged the commonly held view that Europeans controlled the largest share of world trade in the seventeenth through the eighteenth centuries. Which of the following evidence from the period would best support this historical reinterpretation?", choices:["Prices for Chinese goods were much higher in Europe than in China.","European trading companies often backed their long-distance trading ventures with the threat of military force.","Asian trading companies dominated trade in the Indian Ocean region.","European merchants transported only a fraction of the goods shipped globally."], answer:3, why:"If European merchants carried only a fraction of the goods shipped worldwide, Europeans did not control most global trade."},
  {prompt:"Which of the following represents a significant change in Africa between 1450 C.E. and 1750 C.E.?", choices:["Bantu-speaking people spread iron metallurgy to East and Central Africa.","Europeans established settler colonies in East and Central Africa.","Most enslaved Africans were transported across the Atlantic instead of the Sahara.","Islam was introduced and widely adopted in North Africa."], answer:2, why:"The transatlantic slave trade expanded greatly in this period, while the other developments began earlier or occurred later."},
  {prompt:"Which of the following describes the most important cause of the demographic changes associated with the Columbian Exchange?", choices:["The spread of New World diseases to Afro-Eurasia and environmental damage in the Americas","The introduction of New World food crops to Afro-Eurasia and the spread of epidemic diseases to the Americas","Environmental degradation in Afro-Eurasia and the spread of Afro-Eurasian food crops to the Americas","European settlement in the Americas and the forced migration of Native Americans to Afro-Eurasia"], answer:1, why:"American crops supported population growth in Afro-Eurasia, while Eurasian diseases caused catastrophic population losses among Indigenous peoples in the Americas."},
  {prompt:"Which of the following was a major long-term effect of Vasco da Gama’s voyage to India in the late 1490s?", choices:["It led to the integration of European merchants into the Indian Ocean economy.","It brought about the complete destruction of Muslim-controlled trade routes in the Indian Ocean.","It spurred the Mughal Empire to invest resources in becoming a major naval power.","It catalyzed the adoption of new European naval technology by states throughout the Indian Ocean basin."], answer:0, why:"Da Gama’s voyage opened a sea route that brought Portuguese and other European merchants into existing Indian Ocean commercial networks."},
  {prompt:"In the period 1450 to 1750, the intensification of connections between the Eastern Hemisphere and the Western Hemisphere had which of the following effects on religious practices?", choices:["Christianity became more uniform as it spread through the Americas.","Buddhism spread widely in Africa.","Syncretic forms of religion such as Vodun developed.","Splits in Islam became less intense."], answer:2, why:"Contact between African, Indigenous American, and Christian traditions produced syncretic religions, including Vodun."},
  {prompt:"Which of the following best exemplifies mercantilism as it was practiced in the Atlantic trading system by 1750?", choices:["The belief of colonists in the Americas that free trade was desirable","Colonial government policies in Europe that prevented the private accumulation of precious metals","International agreements by European governments to protect the freedom of the seas","The protection of European merchant companies by their respective governments"], answer:3, why:"Mercantilist states used government power to protect national merchants and direct colonial trade for state benefit."},
  {prompt:"Many forced and free migrants practiced the religious beliefs of their homelands as a way of adapting to unfamiliar experiences and environments in their destination societies. Which of the following processes best supports the historical argument above?", choices:["African slaves in the Americas integrating African beliefs into their practice of Christianity","Japanese elites of the Tokugawa period encouraging the spread of Buddhism to promote cultural cohesion","Chinese migrant laborers in the United States converting to Christianity in order to better fit into the dominant culture","The indigenous rulers of Islamic states in Southeast Asia adapting aspects of Islam to local cultural and religious traditions"], answer:0, why:"Enslaved Africans carried religious traditions to the Americas and blended them with Christianity in their new societies."},
  {prompt:"Which of the following changes best justifies the claim that the late 1400s mark the beginning of a new period in world history?", choices:["The rise of the Aztec and Inca empires","The economic recovery in Afro-Eurasia after the Black Death","The incorporation of the Americas into a broader global network of exchange","The emergence of new religious movements in various parts of the world"], answer:2, why:"The Columbian Exchange connected the Americas to Afro-Eurasia in a sustained global network for the first time."},
  {prompt:"Which of the following best illustrates the argument described in the passage above?", choices:["Spanish and Portuguese plantation owners imported large numbers of African slaves to work their fields.","Amerindians were killed in large numbers by diseases such as smallpox and measles.","Some Amerindian societies prior to European contact had high population densities and large urban centers of comparable scale to those in Europe.","The Spanish system of forced labor in mines such as those in Potosí resulted in thousands of deaths among the Amerindian population."], answer:1, why:"The passage argues that Europeans and Africans brought diseases against which Indigenous Americans lacked prior exposure, causing massive demographic losses.", stimulus:{kind:"quote", body:"“The inhabitants of the New World were bearers of no serious new infection transferable to the European and African populations that intruded upon their territory . . . whereas the abrupt confrontation with the long array of infections that European and African populations had encountered piecemeal across some four thousand years of civilized history provoked massive demographic disaster among Amerindians.”", citation:"William McNeill, world historian, 1976"}},

  {prompt:"Which of the following was the most important factor in the spread of the bubonic plague in Eurasia?", choices:["The Mongol expansion from central Asia to China, eastern Europe, and the Middle East","The consolidation of western European monarchies","The spread of Buddhism from central Asia to China","The population decline and the outbreak of peasant revolts in eastern Europe"], answer:0, why:"Mongol expansion and the trade networks it protected increased movement across Eurasia, helping the plague spread."},
  {prompt:"Which of the following accurately describes a significant difference between the Ottoman and Mughal Empires in the early seventeenth century?", choices:["The Mughals practiced religious tolerance toward non-Muslim subjects, while the Ottomans did not.","The Ottomans ruled over people who were predominantly Muslim, while the Mughals did not.","The Mughals used gunpowder weapons to expand their territory, while the Ottomans did not.","The Ottomans made Shia Islam the official state religion, while the Mughals made Buddhism the official state religion."], answer:1, why:"Most Ottoman subjects were Muslim, while Muslims were a minority in the Mughal Empire, whose population was predominantly Hindu."},

  {prompt:"Which of the following was the most important factor in the spread of Islam in Southeast Asia in the period circa 1250–1500 C.E.?", choices:["The religious zeal of Muslim soldiers willing to die to spread Islam","The activities of Muslim traders and Sufi missionaries","The relative lack of interest in Islam among Hindus and Buddhists","Muslim rulers’ policy of tolerance of all religions practiced in their realms"], answer:1, why:"Muslim merchants and Sufi missionaries brought Islam to Southeast Asian port cities through trade and preaching."},
  {prompt:"Which of the following contributed most to the Ottoman Empire’s successful expansion in Europe and the Middle East in the period 1450 to 1600?", choices:["The Ottomans’ use of revenues from transoceanic trade to build a powerful army","The Ottomans’ use of nomadic tribes as cavalry troops","The Ottomans’ adoption of the latest gunpowder and artillery technology","The Ottomans’ exploitation of Muslim desire to avenge the Crusades"], answer:2, why:"Ottoman armies used advanced gunpowder weapons and artillery to capture territory across Europe and the Middle East."},
  {prompt:"Ibn Battuta traveled widely across the Middle East, South Asia, Southeast Asia, and Africa in the fourteenth century. His travels serve as evidence for", choices:["the unifying influence of Islam","the excellent condition of roads in Africa and Asia","the political unity of Africa and Asia","the widespread use of paper money"], answer:0, why:"Ibn Battuta’s journeys across many Muslim regions show how Islam connected societies across Afro-Eurasia."},
  {prompt:"Which of the following factors represents the most significant cause of the growth of cities in Afro-Eurasia in the period 1000–1450?", choices:["Climate change","Increased interregional trade","Decreased agricultural productivity","Increased invasions"], answer:1, why:"Expanding regional and long-distance trade supported urban growth by bringing merchants, goods, and jobs to cities."},
  {prompt:"Malian Emperor Mansa Musa’s pilgrimage to Mecca in 1324 can best be understood in the context of which of the following?", choices:["The expansion of Islam throughout Afro-Eurasia","The development of new transportation technologies","The diffusion of African culture to the Middle East","The territorial expansion of West African empires"], answer:0, why:"Mansa Musa’s pilgrimage reflected the spread of Islam into West Africa and its links to the broader Muslim world."},
  {prompt:"Which of the following accurately describes the Mongol Empire’s role in facilitating trans-Eurasian trade?", choices:["It imposed Mongol religious beliefs and practices on conquered peoples.","It reestablished the Silk Roads between East Asia and Europe.","It created a self-contained economic system by banning non-Mongol merchants from its territories.","It developed a sophisticated bureaucracy staffed by talented Mongols."], answer:1, why:"Mongol rule secured and reopened long-distance routes linking East Asia, Central Asia, and Europe."},
  {prompt:"Between 1450 and 1750, empires such as the Ottoman and Chinese shared which of the following?", choices:["Dependence on trade as the main basis for the economy","An elite fighting force made up primarily of slaves","The use of a large bureaucracy to support the government","Continual military campaigns against European armies"], answer:2, why:"Both empires relied on large administrative bureaucracies to govern extensive territories and populations."},
  {prompt:"Which of the following statements is true about both the Mughal and Ottoman empires in the sixteenth century?", choices:["In both empires the majority of the people were Muslims.","Both empires had powerful navies that engaged European navies.","Both empires expanded through the use of gunpowder weapons and extensive bureaucracies.","Both empires gave little monetary support to artistic and cultural endeavors."], answer:2, why:"Both empires expanded with gunpowder armies and used bureaucratic institutions to administer their lands."},
  {prompt:"Which of the following was an important continuity in the global economy from 1500 C.E. to 1700 C.E.?", choices:["Muslim merchants controlled most major trade routes.","Asian societies produced most of the world’s manufactured goods.","Most goods were exchanged using overland trade routes.","Reliance on coerced labor systems declined."], answer:1, why:"Asian economies continued to produce a large share of the world’s manufactured goods throughout this period."},
  {prompt:"Which of the following was a common feature of most Asian and European philosophies during the period 1000 to 1450?", choices:["A close association with religion","Emphasis on experimental science","Reliance on ideas of individual freedom","Substantial scholarly exchange of ideas among all world cultures","Wide availability through printed books"], answer:0, why:"Philosophical systems in both regions were closely connected to religious traditions and institutions."},
  {prompt:"The spread of Bantu-speaking peoples over southern Africa can be best explained by their", choices:["conversion to Islam","superior naval technology","use of cavalry","centralized political systems","knowledge of agriculture"], answer:4, why:"Agriculture supported population growth and migration, helping Bantu-speaking peoples expand across Africa."},
  {prompt:"The increased food production accompanying the introduction of Champa rice into China from Vietnam during the eleventh century best illustrates which of the following?", choices:["The reliance of China on food imports","The importance of Vietnam to the world economy","The stimulation of agriculture by technological innovation","The influence of China on neighboring societies"], answer:2, why:"A new, fast-ripening rice variety increased agricultural output, showing how innovation could raise food production."},
  {prompt:"Which of the following would best support the conclusion that the Columbian Exchange involved more profound consequences than did earlier biological exchanges in world history?", choices:["Previous exchanges did not involve societies at radically different levels of technological development.","Previous exchanges did not involve the world’s two hemispheres.","The Columbian Exchange involved the peaceful transfer of animals, plants, and diseases.","The Columbian Exchange was accompanied by the spread of missionary religions."], answer:1, why:"The Columbian Exchange connected the previously separate Eastern and Western hemispheres."},

  {prompt:"Which of the following most directly contributed to the decline of Eurasian urban populations during the fourteenth century?", choices:["Climate change","Epidemic disease","Religious wars","Regional migration"], answer:1, why:"The Black Death and other epidemics caused major population losses in cities across Eurasia."},

  {prompt:"Which of the following was a major change in global patterns of religious beliefs and practices in the period 1450–1750 C.E.?", choices:["The emergence of syncretic religions led to an increase in polytheism.","Adherents of monotheistic religions such as Christianity and Islam increased both in number and in geographic scope as a result of conquest, trade, and missionary activities.","Intellectual movements such as the European Enlightenment weakened the authority of established religions and led to the growing popularity of atheism worldwide.","Messianic, revivalist, and fundamentalist movements came to dominate the indigenous religious traditions in Africa, Asia, and the Americas in response to Western imperialism."], answer:1, why:"Christianity and Islam expanded in population and reach through conquest, commerce, and missionary work."},
  {prompt:"In the period 1000 to 1450, which of the following developments partially resulted from knowledge of Greek science and technology?", choices:["Japanese temple design in Kyoto","Christian theology in the Roman Empire","Islamic medical books in Baghdad","Mongol military tactics in Central Asia","Inca bridge design in the Andes"], answer:2, why:"Scholars in Baghdad translated and built on Greek medical and scientific texts, contributing to Islamic medicine."}
];
const stateKey = "unit4-practice-test-state-v1";
let saved = {};
try { saved = JSON.parse(localStorage.getItem(stateKey) || "{}"); } catch (_) { saved = {}; }
let current = Math.min(Math.max(Number(saved.current || 0), 0), questions.length - 1);
const answers = Array.isArray(saved.answers) ? saved.answers : Array(questions.length).fill(null);
while (answers.length < questions.length) answers.push(null);
const reviews = Array.isArray(saved.reviews) ? saved.reviews : Array(questions.length).fill(false);
while (reviews.length < questions.length) reviews.push(false);
const workspace = document.getElementById("workspace");
const stimulusEl = document.getElementById("stimulus");
const qnumberEl = document.getElementById("qnumber");
const promptEl = document.getElementById("prompt");
const choicesEl = document.getElementById("choices");
const feedbackEl = document.getElementById("feedback");
const reviewToggle = document.getElementById("reviewToggle");
const reviewLabel = document.getElementById("reviewLabel");
const progressButton = document.getElementById("progressButton");
const backButton = document.getElementById("backButton");
const nextButton = document.getElementById("nextButton");
const reviewModal = document.getElementById("reviewModal");
const questionGrid = document.getElementById("questionGrid");
const scoreBox = document.getElementById("scoreBox");
function persist() {
  try { localStorage.setItem(stateKey, JSON.stringify({current, answers, reviews})); } catch (_) {}
}
function letter(i) { return String.fromCharCode(65 + i); }
function safe(text) { return String(text).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }
function showStimulus(item) {
  stimulusEl.innerHTML = "";
  stimulusEl.classList.remove("visible");
  workspace.classList.remove("with-stimulus");
  if (!item) return;
  stimulusEl.classList.add("visible");
  workspace.classList.add("with-stimulus");
  if (item.kind === "quote") {
    const quote = document.createElement("div"); quote.className = "quote"; quote.textContent = item.body;
    const cite = document.createElement("div"); cite.className = "citation"; cite.textContent = item.citation;
    stimulusEl.append(quote, cite);
  } else if (item.kind === "art") {
    const title = document.createElement("div"); title.className = "caption"; title.textContent = item.title;
    const image = document.createElement("img"); image.className = "art"; image.src = item.image; image.alt = item.alt;
    const cite = document.createElement("div"); cite.className = "caption"; cite.textContent = item.citation;
    const note = document.createElement("div"); note.className = "note"; note.textContent = item.note;
    stimulusEl.append(title, image, cite, note);
  } else if (item.kind === "map") {
    const title = document.createElement("div"); title.className = "caption"; title.textContent = item.title;
    const image = document.createElement("img"); image.className = "map"; image.src = item.image; image.alt = item.alt;
    stimulusEl.append(title, image);
  }
}
function renderFeedback(q, selected, checked) {
  feedbackEl.className = "feedback";
  feedbackEl.innerHTML = "";
  if (!checked || selected === null) return;
  const correct = selected === q.answer;
  feedbackEl.classList.add("visible", correct ? "correct" : "incorrect");
  const title = document.createElement("strong");
  title.textContent = correct ? "Correct." : `Not quite. The correct answer is ${letter(q.answer)}.`;
  const why = document.createElement("div"); why.className = "why"; why.textContent = q.why;
  feedbackEl.append(title, why);
}
function render() {
  const q = questions[current];
  const selected = answers[current] && Number.isInteger(answers[current].selected) ? answers[current].selected : null;
  const checked = !!(answers[current] && answers[current].checked);
  qnumberEl.textContent = String(current + 1);
  promptEl.textContent = q.prompt;
  reviewToggle.setAttribute("aria-pressed", String(!!reviews[current]));
  reviewLabel.textContent = reviews[current] ? "Marked for Review" : "Mark for Review";
  showStimulus(q.stimulus);
  choicesEl.innerHTML = "";
  q.choices.forEach((text, i) => {
    const button = document.createElement("button");
    button.type = "button"; button.className = "choice";
    if (selected === i) button.classList.add("selected");
    if (checked && i === q.answer) button.classList.add("is-correct");
    if (checked && selected === i && selected !== q.answer) button.classList.add("is-wrong");
    button.setAttribute("aria-pressed", String(selected === i));
    button.setAttribute("aria-label", `Answer ${letter(i)}: ${text}`);
    button.innerHTML = `<span class="letter">${letter(i)}</span><span class="choice-text">${safe(text)}</span>`;
    button.addEventListener("click", () => { answers[current] = {selected:i, checked:false}; persist(); render(); });
    choicesEl.append(button);
  });
  renderFeedback(q, selected, checked);
  progressButton.textContent = `Question ${current + 1} of ${questions.length}　⌃`;
  progressButton.setAttribute("aria-label", `Open question review. Question ${current + 1} of ${questions.length}`);
  backButton.disabled = current === 0;
  nextButton.textContent = current === questions.length - 1 ? "Check Work" : "Next";
  persist();
  if (reviewModal.classList.contains("open")) renderReview();
}
function go(index) { current = Math.max(0, Math.min(questions.length - 1, index)); render(); window.scrollTo({top:0, behavior:"smooth"}); }
function renderReview() {
  const answered = answers.filter(a => a && Number.isInteger(a.selected)).length;
  const checkedCount = answers.filter(a => a && a.checked).length;
  const checkedCorrect = answers.filter((a, i) => a && a.checked && a.selected === questions[i].answer).length;
  const reviewCount = reviews.filter(Boolean).length;
  scoreBox.innerHTML = `<strong>${answered} of ${questions.length} answered</strong> · ${reviewCount} marked for review<br>${checkedCount ? `${checkedCorrect} correct out of ${checkedCount} checked` : "Check answers to see your score."}`;
  questionGrid.innerHTML = "";
  questions.forEach((q, i) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "grid-cell"; b.textContent = String(i + 1);
    if (answers[i] && Number.isInteger(answers[i].selected)) b.classList.add("answered");
    if (i === current) b.classList.add("current");
    if (reviews[i]) b.classList.add("review");
    b.setAttribute("aria-label", `Go to question ${i + 1}${answers[i] ? ", answered" : ", unanswered"}${reviews[i] ? ", marked for review" : ""}`);
    b.addEventListener("click", () => { closeReview(); go(i); });
    questionGrid.append(b);
  });
}
function openReview() { renderReview(); reviewModal.classList.add("open"); document.getElementById("closeModal").focus(); }
function closeReview() { reviewModal.classList.remove("open"); progressButton.focus(); }
function checkCurrent() {
  const a = answers[current];
  if (!a || !Number.isInteger(a.selected)) {
    feedbackEl.className = "feedback visible incorrect";
    feedbackEl.textContent = "Choose an answer before checking.";
    return;
  }
  answers[current] = {selected:a.selected, checked:true}; persist(); render();
}
document.getElementById("checkButton").addEventListener("click", checkCurrent);
document.getElementById("clearButton").addEventListener("click", () => { answers[current] = null; render(); });
reviewToggle.addEventListener("click", () => { reviews[current] = !reviews[current]; render(); });
backButton.addEventListener("click", () => go(current - 1));
nextButton.addEventListener("click", () => current === questions.length - 1 ? openReview() : go(current + 1));
progressButton.addEventListener("click", openReview);
document.getElementById("closeModal").addEventListener("click", closeReview);
document.getElementById("finishButton").addEventListener("click", () => {
  questions.forEach((_, i) => { if (answers[i] && Number.isInteger(answers[i].selected)) answers[i] = {selected:answers[i].selected, checked:true}; });
  persist(); renderReview();
});
reviewModal.addEventListener("click", event => { if (event.target === reviewModal) closeReview(); });
document.addEventListener("keydown", event => {
  if (reviewModal.classList.contains("open")) { if (event.key === "Escape") closeReview(); return; }
  if (event.target.matches("input, textarea, select")) return;
  if (event.key === "ArrowLeft") go(current - 1);
  if (event.key === "ArrowRight") current === questions.length - 1 ? openReview() : go(current + 1);
  const idx = "ABCDE".indexOf(event.key.toUpperCase());
  if (idx >= 0 && idx < questions[current].choices.length) { answers[current] = {selected:idx, checked:false}; render(); }
});
render();
</script>
</body>
